domain: build
summary: "Build targets, mise tasks, Dockerfile, install.sh, and the GitHub Actions CI/release pipelines."
last_updated: "2026-07-30"  # release YAML notes + stacker-style publisher

version:
  current: "0.0.5"
  sources:
    - path: VERSION
      role: "Single line — bumped on release via `chore(release)` commits."
    - path: Cargo.toml
      role: "`[package].version` — kept in sync with VERSION."
    - path: releases/
      role: "Hand-written per-tag YAML notes (releases/vX.Y.Z.yaml) preferred by release.py."
    - path: releases_notes.toml
      role: "DEPRECATED — historical pointer; release.py uses releases/*.yaml only."

toolchain:
  rust: "1.91.1"
  sources:
    - path: .mise.toml
      role: "Pins Rust via mise (`[tools].rust = \"1.91.1\"`)."
    - path: Dockerfile
      role: "`FROM rust:1.91.1-slim AS builder`."
    - path: .github/workflows/ci.yml
      role: "Same version pinned on dtolnay/rust-toolchain."
    - path: .github/workflows/release.yml
      role: "Same version pinned for each matrix target."

mise_tasks:
  - name: setup
    path: .mise.toml
    role: "Installs Rust 1.91.1 and adds x86_64-unknown-linux-{gnu,musl} targets."
  - name: build
    path: .mise.toml
    role: "Default release build (`cargo build --release`)."
  - name: "build:linux-gnu"
    path: .mise.toml
    role: "Release build for x86_64-unknown-linux-gnu."
  - name: "build:linux-musl"
    path: .mise.toml
    role: "Static MUSL build — relies on `.cargo/config.toml` for link-self-contained."
  - name: "build:mac-silicon"
    path: .mise.toml
    role: "Release build for aarch64-apple-darwin."
  - name: "build:all"
    path: .mise.toml
    role: "Composite that runs build:linux-gnu + build:linux-musl."
  - name: install
    path: .mise.toml
    role: "Release build + copy to ~/.local/bin/confctl."
  - name: test
    path: .mise.toml
    role: "`cargo test`."
  - name: check
    path: .mise.toml
    role: "`cargo check`."
  - name: clippy
    path: .mise.toml
    role: "`cargo clippy -- -D warnings`."
  - name: fmt
    path: .mise.toml
    role: "`cargo fmt`."
  - name: "fmt:check"
    path: .mise.toml
    role: "`cargo fmt -- --check` — used by CI."
  - name: "skills:list"
    path: .mise.toml
    role: "List AI agents detected on this machine (`python scripts/install_skills.py --list`)."
  - name: "skills:install"
    path: .mise.toml
    role: "Install confctl SKILL.md for detected agents (Claude, Codex, Cursor, Grok, …)."
  - name: "skills:install:all"
    path: .mise.toml
    role: "Install confctl SKILL.md into every known agent path."
  - name: "test:skills"
    path: .mise.toml
    role: "Unit tests for scripts/install_skills.py."
  - name: "release:check"
    path: .mise.toml
    role: "Compile + unittest release.py and --validate-tag smoke check."

cargo_config:
  - path: .cargo/config.toml
    role: "Static-link flags for x86_64-unknown-linux-musl (`+crt-static`, `link-self-contained=yes`)."

docker:
  - path: Dockerfile
    role: "Two-stage build: rust:1.91.1-slim builder with musl-tools → scratch image shipping a single static binary at `/confctl` as ENTRYPOINT."

install_script:
  - path: install.sh
    role: "Detects OS/arch (linux/amd64, darwin/arm64, darwin/amd64), downloads the matching binary from GitHub Releases, installs to /usr/local/bin/confctl. Optional CONFCTL_INSTALL_SKILLS=1 installs skills/confctl/SKILL.md into detected agent homes (including ~/.grok/skills/confctl)."

agent_skills:
  - path: skills/confctl/SKILL.md
    role: "Canonical Agent Skills package — teaches confctl queries and -r / -r 10 / -r 20 redaction for Grok and other agents."
  - path: skills/README.md
    role: "Install docs for multi-agent skill paths."
  - path: scripts/install_skills.py
    role: "Detects AI tools and copies SKILL.md to project/global skill dirs (Grok: ~/.grok/skills/confctl)."
  - path: scripts/install-skills.sh
    role: "Thin sh wrapper around install_skills.py."
  - path: scripts/test_install_skills.py
    role: "Unit tests for the skill installer (includes Grok path)."

artefacts:
  - name: confctl-linux-amd64
    target: x86_64-unknown-linux-musl
    role: "Fully static Linux binary — the one ADD-pulled into Dockerfiles."
  - name: confctl-darwin-arm64
    target: aarch64-apple-darwin
    role: "macOS Apple Silicon build."
  - name: confctl-darwin-amd64
    target: x86_64-apple-darwin
    role: "macOS Intel build."

github_workflows:
  - name: CI Pipeline
    path: .github/workflows/ci.yml
    triggers: ["push to main", "PR to main", "workflow_dispatch"]
    role: "fmt --check → clippy -D warnings → cargo test → cargo build --release → upload artifact `confctl-binary`."
  - name: CD Pipeline - Release
    path: .github/workflows/release.yml
    triggers: ["push to tags v*", "push to main", "workflow_dispatch"]
    role: "Validates release.py, matrix-builds three binaries, writes checksums.txt, publishes GitHub Release (YAML notes or conventional commits)."
  - name: Auto Tag (Manual)
    path: .github/workflows/tag.yml
    triggers: ["workflow_dispatch"]
    role: "Runs release.py --bump-tag to create and push the next patch SemVer tag."

release_script:
  - path: .github/scripts/release.py
    role: "Stdlib GitHub publisher: verifies confctl-* + checksums.txt; body from releases/<tag>.yaml or commit subjects; --bump-tag / --validate-tag."
  - path: .github/scripts/test_release.py
    role: "Unit tests for tag validation, YAML notes dialect, conventional commits, and asset checksums."
  - path: releases/README.md
    role: "Schema and workflow for hand-written release notes YAML."

related:
  - domain: cli
    why: "The binary `confctl` built here is the single consumer of every other domain."
  - domain: parser
    why: "Dockerfile ships the static MUSL binary that install.sh distributes."
