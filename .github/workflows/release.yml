name: CD Pipeline - Release

permissions:
  contents: write
  actions: read

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "SemVer tag to publish, for example v0.0.6 (defaults to GITHUB_REF_NAME / latest on main)"
        required: false
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test-release-script:
    name: Validate release publisher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test release publisher
        run: |
          python -m py_compile .github/scripts/release.py .github/scripts/test_release.py
          python -m unittest discover -s .github/scripts -p 'test_*.py'
          if [ "${{ github.ref_type }}" = "tag" ]; then
            python .github/scripts/release.py --validate-tag "$RELEASE_TAG"
          elif [ -n "${{ inputs.tag }}" ]; then
            python .github/scripts/release.py --validate-tag "${{ inputs.tag }}"
          else
            python .github/scripts/release.py --validate-tag v0.0.0
          fi

  build:
    name: Build - ${{ matrix.target }}
    needs: test-release-script
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: confctl-linux-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: confctl-darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            binary_name: confctl-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91.1"
          targets: ${{ matrix.target }}

      - name: Install MUSL toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/confctl ${{ matrix.binary_name }}
          chmod +x ${{ matrix.binary_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history + tags: release.py prefers releases/<tag>.yaml notes,
          # and falls back to commit subjects since the previous SemVer tag.
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: confctl-*
          merge-multiple: true

      - name: Prepare binaries and checksums
        run: |
          mkdir -p release
          # Support both merged and nested artifact layouts
          if ls artifacts/confctl-* 1>/dev/null 2>&1; then
            cp artifacts/confctl-* release/
          else
            find artifacts -type f -name 'confctl-*' -exec cp {} release/ \;
          fi
          cd release
          sha256sum confctl-* > checksums.txt
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Publish GitHub Release
        run: python .github/scripts/release.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # On main branch pushes, refresh assets on the latest SemVer tag.
          UPDATE_LATEST_RELEASE: ${{ github.ref_type == 'branch' && 'true' || 'false' }}
          # When workflow_dispatch supplies a tag, prefer it.
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || env.RELEASE_TAG }}

      - name: Release Summary
        if: success()
        run: |
          {
            echo "### Release published"
            echo ""
            echo "#### Binaries"
            for f in release/confctl-*; do
              SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
              echo "- $(basename "$f"): ${SIZE} bytes"
            done
            echo "- checksums.txt"
            if [ -f releases/"${RELEASE_TAG}.yaml" ] || [ -f releases/"${RELEASE_TAG}.yml" ]; then
              echo ""
              echo "Notes source: \`releases/${RELEASE_TAG}.yaml\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
