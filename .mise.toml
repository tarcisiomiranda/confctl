[tools]
rust = "1.91.1"

[settings]
env_shell_expand = true

# Prepend cargo user bins only. Do NOT put "$PATH" here: mise expands it against
# a partial env, and the VS Code mise extension would then wipe /usr/bin from PATH
# (stty/dircolors/cat: command not found in the integrated terminal).
[env]
_.path = ["$HOME/.cargo/bin"]

# ============================================
# confctl — Setup
# ============================================
[tasks.setup]
description = "Instala toolchain Rust e adiciona targets de compilação"
run = """
echo "==> Instalando toolchain Rust 1.91.1..."
rustup install 1.91.1
rustup default 1.91.1

echo "==> Adicionando targets..."
rustup target add x86_64-unknown-linux-gnu
rustup target add x86_64-unknown-linux-musl

echo "==> Setup concluído!"
rustc --version
"""

# ============================================
# confctl — Build
# ============================================
[tasks."build:linux-gnu"]
description = "Build release para x86_64-unknown-linux-gnu"
run = """
rustup target add x86_64-unknown-linux-gnu 2>/dev/null || true
cargo build --release --target x86_64-unknown-linux-gnu
echo "Binary: target/x86_64-unknown-linux-gnu/release/confctl"
"""

[tasks."build:linux-musl"]
description = "Build release estático para x86_64-unknown-linux-musl"
run = """
echo "==> Build estático MUSL (link-self-contained via .cargo/config.toml)..."
rustup target add x86_64-unknown-linux-musl 2>/dev/null || true
cargo build --release --target x86_64-unknown-linux-musl
echo "Binary: target/x86_64-unknown-linux-musl/release/confctl"
"""

[tasks."build:all"]
description = "Build GNU + MUSL"
depends = ["build:linux-gnu", "build:linux-musl"]

[tasks."build"]
description = "Build padrão (release)"
run = "cargo build --release"

[tasks."build:mac-silicon"]
description = "Build release para Mac Silicon (aarch64-apple-darwin)"
run = """
rustup target add aarch64-apple-darwin 2>/dev/null || true
cargo build --release --target aarch64-apple-darwin
echo "Binary: target/aarch64-apple-darwin/release/confctl"
"""

[tasks."install"]
description = "Build e instala o binário em ~/.local/bin"
run = """
echo "==> Building release..."
cargo build --release

echo "==> Installing to ~/.local/bin..."
mkdir -p ~/.local/bin
cp target/release/confctl ~/.local/bin/
chmod +x ~/.local/bin/confctl

echo "==> Installed! Make sure ~/.local/bin is in your PATH"
~/.local/bin/confctl --version
"""

# ============================================
# confctl — Quality
# ============================================
[tasks.test]
description = "Executa os testes"
run = "cargo test"

[tasks.check]
description = "Verifica compilação sem gerar binário"
run = "cargo check"

[tasks.clippy]
description = "Executa clippy linter"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "Formata o código com rustfmt"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Verifica formatação sem alterar"
run = "cargo fmt -- --check"

# ============================================
# confctl — Agent skills
# ============================================
[tasks."skills:list"]
description = "Lista AI agents detectados nesta máquina"
run = "python scripts/install_skills.py --list"

[tasks."skills:install"]
description = "Detecta AI agents e instala confctl SKILL.md (inclui Grok)"
run = "python scripts/install_skills.py"

[tasks."skills:install:all"]
description = "Instala confctl SKILL.md em todos os caminhos conhecidos"
run = "python scripts/install_skills.py --all"

[tasks."test:skills"]
description = "Testa o instalador de skills"
run = "python -m unittest discover -s scripts -p 'test_install_skills.py'"

# ============================================
# confctl — Release
# ============================================
[tasks."release:check"]
description = "Valida o publisher de GitHub Release (YAML notes + checksums)"
run = """
python -m py_compile .github/scripts/release.py .github/scripts/test_release.py
python -m unittest discover -s .github/scripts -p 'test_*.py'
python .github/scripts/release.py --validate-tag v0.0.0
"""
